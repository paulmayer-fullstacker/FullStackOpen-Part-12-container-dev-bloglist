# nginx.dev.conf:
# Development Nginx Reverse Proxy Configuration with front and backend routing.
# 'events' block is required by Nginx (even if empty), to configure connection processing.
events { }

http {
  server {
    # Nginx will listen on port 80 inside its container.
    listen 80;
    # Rule-1: Route general traffic (frontend UI and hot-reloading WebSockets).
    location / {
      # Configure Nginx to support WebSocket connection, so that Vite hot reload will work through the proxy.
      # HTTP v1.1 required to support persistent connections and protocol upgrades.
      proxy_http_version 1.1;
       # Forward the 'Upgrade' header from the client to allow protocol switching (from HTTP to WebSocket).
      proxy_set_header Upgrade $http_upgrade;
       # Set the connection header to 'upgrade' to establish a live WebSocket tunnel for dynamic rerender.
      proxy_set_header Connection 'upgrade';
      # Forward requests to the frontend container service.
      proxy_pass http://frontend:5173; 
    }
    # Rule-2: Requests starting with /api/ are handled and routed to the Express backend container
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      # Forward requests to the backend container service
      proxy_pass http://backend:3003;
    }
  }
}